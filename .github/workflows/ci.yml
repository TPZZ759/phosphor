name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Check Rust server
        working-directory: server
        run: cargo check --locked
