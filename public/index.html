<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="app.css?v=13">
</head>
<body>
  <header id="nav">
    <a class="brand" href="#/home" aria-label="Home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M13 12.5v7l6-3.5z" fill="currentColor"/></svg>
    </a>
    <nav class="tabs">
      <a href="#/home" data-tab="home">Home</a>
      <a href="#/tonight" data-tab="tonight">Tonight</a>
      <a href="#/browse" data-tab="browse">Browse</a>
      <a href="#/series" data-tab="series">Series</a>
      <a href="#/movies" data-tab="movies">Movies</a>
      <a href="#/docs" data-tab="docs">Docs</a>
      <a href="#/anime" data-tab="anime">Anime</a>
      <a href="#/sports" data-tab="sports">Sports</a>
      <a href="#/live" data-tab="live">Live TV</a>
      <a href="#/mylist" data-tab="mylist">My List</a>
    </nav>
    <div class="nav-right">
      <button class="sub-pill" id="subPill" data-settings hidden></button>
      <label class="search" id="searchBox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Titles, topics, people, channels" autocomplete="off" aria-label="Search">
      </label>
      <button class="icon-btn dice" data-surprise="" title="Pick for me (Watch-Night Concierge)" aria-label="Pick for me">🎲</button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="modal" class="modal" hidden></div>
  <div id="player" class="player" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=24"></script>
</body>
</html>
